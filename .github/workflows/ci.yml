name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Supply-chain baseline (homelab-governance, 2026-10-20): every action pinned to a full commit SHA with its tag as a
# comment, checkouts keep no token, npm installs from the lockfile with install scripts off (as the publish job does).
# The workflow grants nothing; each job asks for exactly what it needs.
permissions: {}
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true } # a newer push supersedes a running check

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # TODO(2026-10-21): make this blocking (drop continue-on-error) once the lockfile is clean. On main,
      # `npm audit --omit=dev --audit-level=high` fails: @modelcontextprotocol/sdk <=1.31.0 (direct, high) and, through
      # it, proxy-addr (critical), fast-uri, hono, ip-address and path-to-regexp (high). The fixes are in Dependabot
      # PR #18 (npm_and_yarn group, opened 2026-10-21; sdk 1.32.0 and the others), not merged yet. Blocking now would turn
      # every CI run red.
      - name: Security audit
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  zizmor:
    # security audit of the workflows (config: .github/zizmor.yml). The action runs zizmor's container image by version
    # and digest (its support/versions list); results go to the log, not to code scanning.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: "1.30.1"
          advanced-security: false
