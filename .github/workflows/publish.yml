name: Publish to npm

on:
  release:
    # published, not created: GitHub runs no workflow for a draft's created event, so a release saved as a draft
    # first would never publish. A release created without a draft step also fires published, once.
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Update npm for Trusted Publishing
        # Exact version, at least two weeks old; trusted publishing needs npm 11.5.1 or newer.
        run: npm install -g npm@11.21.0

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish with provenance (Trusted Publishing / OIDC)
        run: npm publish --provenance --access public
