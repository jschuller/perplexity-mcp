name: Publish to npm

on:
  release:
    # published, not created: GitHub runs no workflow for a draft's created event, so a release saved as a draft
    # first would never publish. A release created without a draft step also fires published, once.
    types: [published]

# Supply-chain baseline (homelab-governance, 2026-10-20): the workflow grants nothing and the job asks for exactly what it
# needs; actions pinned by commit SHA; the checkout keeps no token; no cache is restored in this job, which holds the
# publishing OIDC token; Node and npm by exact version; npm installs from the lockfile with install scripts off.
permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read # the checkout
      id-token: write # npm trusted publishing (OIDC) and the provenance statement

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # setup-node v4.4.0 caches only when `cache:` is set (automatic caching came in v5), so nothing is restored here.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4.4.0 # zizmor: ignore[cache-poisoning]
        with:
          # Exact: the newest Node 22 LTS release at least 7 days old (22.23.3, 2026-09-23). npm documents trusted
          # publishing as needing Node 22.14.0 or newer; npm 11.21.0 supports Node ^20.17.0 || >=22.9.0.
          node-version: "22.23.3"
          registry-url: https://registry.npmjs.org

      - name: Update npm for Trusted Publishing
        # Exact version, at least two weeks old; trusted publishing needs npm 11.5.1 or newer.
        run: npm install -g npm@11.21.0 # zizmor: ignore[adhoc-packages] the npm CLI itself, by exact version

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Publish with provenance (Trusted Publishing / OIDC)
        run: npm publish --provenance --access public
